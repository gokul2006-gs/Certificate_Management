# Render Blueprint for the Spring Boot API.
services:
  - type: web
    name: smart-certificate-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: certificate-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_BASE_URL
        value: "https://certificate-management-phi.vercel.app"
      - key: CORS_ORIGIN
        value: "https://certificate-management-phi.vercel.app"
      - key: API_PUBLIC_URL
        value: "https://certificate-management-3.onrender.com"
      - key: PORT
        value: "8080"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "None"
      - key: UPLOAD_ROOT
        value: "/var/data/uploads"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_STUDENT_PASSWORD
        sync: false
