# Render Blueprint for the Node/Express API.
services:
  - type: web
    name: smart-certificate-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_BASE_URL
        value: "https://certificate-management-phi.vercel.app"
      - key: CORS_ORIGIN
        value: "https://certificate-management-phi.vercel.app"
      - key: API_PUBLIC_URL
        value: "https://certificate-management-2.onrender.com"
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: DEFAULT_STUDENT_PASSWORD
        sync: false
