server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: certificate-management-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/smart_certificate_db}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:20}MB
      max-request-size: 80MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-before-deploy-123456}
  cookie-name: ${COOKIE_NAME:sc_session}
  cookie-secure: ${COOKIE_SECURE:false}
  cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  frontend-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors-origins: ${CORS_ORIGIN:http://localhost:5173}
  upload-root: ${UPLOAD_ROOT:./uploads}
  default-student-password: ${DEFAULT_STUDENT_PASSWORD:Tech@123}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-email: ${ADMIN_EMAIL:admin@techscube.local}
  admin-password: ${ADMIN_PASSWORD:}
  api-public-url: ${API_PUBLIC_URL:}
  mail-from: ${MAIL_FROM:}
  storage-provider: ${STORAGE_PROVIDER:local}
